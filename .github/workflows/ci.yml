# Design doc §52: Push → Build → Frontend tests → Backend tests → AI tests → Security checks → Docker build.
name: CI

on:
  push:
    branches: [main, master, develop, "feature/**", "bugfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore OpsPilot.slnx
      - run: dotnet build OpsPilot.slnx --no-restore -c Release -warnaserror
      - run: dotnet test OpsPilot.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Vulnerable package check
        run: |
          dotnet list OpsPilot.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    env:
      SA_PASSWORD: Ci.Only.Sa1!
      AI_READER_PASSWORD: Ci.Only.Reader1!
      JWT_SIGNING_KEY: ci-only-signing-key-not-used-for-anything-real
      ADMIN_PASSWORD: Ci.Only.Admin1!
      AI_INTERNAL_KEY: ci-only-internal-key
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build --pull
      # Deployment is environment-specific and intentionally not wired up here; push these images to a registry
      # and deploy from a protected environment once a target exists.
