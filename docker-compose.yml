# OpsPilot full stack: SQL Server, API, AI service and web app.
#   cp .env.example .env   # then fill in the values
#   docker compose up --build
#   open http://localhost:8080  (admin@opspilot.local / ADMIN_PASSWORD)

name: opspilot

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "14333:1433"   # host port avoids clashing with a locally installed SQL Server
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OpsPilotDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__AiReadOnly: "Server=sqlserver;Database=OpsPilotDb;User Id=opspilot_ai_reader;Password=${AI_READER_PASSWORD:?Set AI_READER_PASSWORD in .env};TrustServerCertificate=True;ApplicationIntent=ReadOnly;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoData: "true"
      Database__MigrateOnStartup: "true"
      Database__EnsureAiReader: "true"
      AiService__BaseUrl: http://ai:8001
      AiService__InternalKey: ${AI_INTERNAL_KEY:?Set AI_INTERNAL_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:8080
    depends_on:
      sqlserver:
        condition: service_healthy

  ai:
    build: ./ai-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL:-openai/gpt-oss-20b}
      INTERNAL_KEY: ${AI_INTERNAL_KEY}
      ERP_API_URL: http://api:8080/api
      ERP_VERIFY_TLS: "false"
    volumes:
      - ai-data:/app/data
      - ai-models:/app/models
    depends_on:
      - api

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mssql-data:
  ai-data:
  ai-models:
