<app-page-header title="Warehouses" subtitle="Stocking locations">
  <button *appHasRole="writeAccess" mat-flat-button routerLink="/inventory/warehouses/new">
    <app-icon name="plus" />
    New warehouse
  </button>
</app-page-header>

<div class="overflow-x-auto panel">
  @if (list.loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (list.error(); as error) {
    <p class="m-0 p-4 text-red-700">{{ error }}</p>
  }

  <table mat-table [dataSource]="list.items()" matSort matSortActive="code" matSortDirection="asc" (matSortChange)="list.onSort($event)" class="w-full">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
      <td mat-cell *matCellDef="let w" class="font-mono">{{ w.code }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let w">{{ w.name }}</td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let w">{{ w.location }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let w">
        <app-status-badge [label]="w.isActive ? 'Active' : 'Inactive'" [tone]="w.isActive ? 'success' : 'neutral'" />
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" (click)="open(row)" class="cursor-pointer hover:bg-slate-50"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="p-4 text-center text-muted" [attr.colspan]="columns.length">
        {{ list.loading() ? 'Loading…' : 'No warehouses yet.' }}
      </td>
    </tr>
  </table>

  <mat-paginator
    [length]="list.totalCount()"
    [pageIndex]="list.query().page - 1"
    [pageSize]="list.query().pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="list.onPage($event)"
  />
</div>
