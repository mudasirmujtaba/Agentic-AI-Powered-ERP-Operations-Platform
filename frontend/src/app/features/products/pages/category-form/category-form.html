<app-page-header [title]="title()" [subtitle]="isNew() ? 'Add a product category' : 'Category details'">
  <a mat-button routerLink="/products/categories">
    <app-icon name="arrow-left" />
    Back to categories
  </a>
</app-page-header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (formError(); as error) {
  <p class="mb-4 rounded-md bg-red-50 p-3 text-red-800">{{ error }}</p>
}

@if (!canEdit()) {
  <p class="mb-4 rounded-md bg-gray-100 p-3 text-sm">You have read-only access to the catalog.</p>
}

<form [formGroup]="form" (ngSubmit)="save()" class="flex max-w-xl flex-col">
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" />
    <mat-error>{{ firstError(form.controls.name) }}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Description <span class="optional">(optional)</span></mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
    <mat-error>{{ firstError(form.controls.description) }}</mat-error>
  </mat-form-field>

  @if (canEdit()) {
    <div class="mt-2 flex gap-2">
      <button mat-flat-button type="submit" [disabled]="saving() || loading()">
        {{ saving() ? 'Saving…' : 'Save category' }}
      </button>
      <a mat-button routerLink="/products/categories">Cancel</a>
    </div>
  }
</form>
