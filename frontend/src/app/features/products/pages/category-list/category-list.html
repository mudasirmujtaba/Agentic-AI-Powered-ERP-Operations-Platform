<app-page-header title="Categories" subtitle="Group products for reporting and browsing">
  <a mat-button routerLink="/products">
    <mat-icon>arrow_back</mat-icon>
    Products
  </a>
  <button *appHasRole="writeAccess" mat-flat-button routerLink="/products/categories/new">
    <mat-icon>add</mat-icon>
    New category
  </button>
</app-page-header>

<div class="overflow-x-auto panel">
  @if (list.loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (list.error(); as error) {
    <p class="m-0 p-4 text-red-700">{{ error }}</p>
  }

  <table mat-table [dataSource]="list.items()" matSort matSortActive="name" matSortDirection="asc" (matSortChange)="list.onSort($event)" class="w-full">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let c">
        <a class="text-inherit underline-offset-2 hover:underline" [routerLink]="['/products/categories', c.id]">{{ c.name }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let c">{{ c.description }}</td>
    </ng-container>

    <ng-container matColumnDef="productCount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-right">Products</th>
      <td mat-cell *matCellDef="let c" class="text-right">{{ c.productCount }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c" class="text-right">
        <button
          mat-icon-button
          [disabled]="c.productCount > 0"
          [matTooltip]="c.productCount > 0 ? 'Move or deactivate its products first' : 'Delete category'"
          (click)="delete(c, $event)"
          aria-label="Delete category"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns()"></tr>
    <tr mat-row *matRowDef="let row; columns: columns()"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="p-4 text-center text-muted" [attr.colspan]="columns().length">
        {{ list.loading() ? 'Loading…' : 'No categories yet.' }}
      </td>
    </tr>
  </table>

  <mat-paginator
    [length]="list.totalCount()"
    [pageIndex]="list.query().page - 1"
    [pageSize]="list.query().pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="list.onPage($event)"
  />
</div>
