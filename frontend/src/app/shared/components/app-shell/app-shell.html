<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-nav">
    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a mat-list-item [routerLink]="link.path" routerLinkActive="active-link" [class.pl-8]="link.child">
          <span [class.text-sm]="link.child">{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell-toolbar">
      <span>OpsPilot</span>
      <span class="spacer"></span>
      @if (authService.currentUser(); as user) {
        <span class="user-email">{{ user.email }}</span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Log out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="shell-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
