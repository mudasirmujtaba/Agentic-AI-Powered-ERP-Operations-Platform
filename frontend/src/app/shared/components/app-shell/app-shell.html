<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a routerLink="/dashboard" class="brand" aria-label="OpsPilot home">
      <app-logo variant="dark" [size]="24" />
    </a>

    <nav class="nav">
      @for (group of groups(); track group.label) {
        <div class="nav-group">
          <div class="nav-group-label">{{ group.label }}</div>
          @for (link of group.links; track link.path) {
            <a
              class="nav-link"
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !!link.exact }"
              #rla="routerLinkActive"
              [attr.aria-current]="rla.isActive ? 'page' : null"
            >
              <app-icon [name]="link.icon" [size]="20" class="nav-icon" />
              <span>{{ link.label }}</span>
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar-footer">v1.0 · {{ roleLabel() }}</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="context">
        @if (section(); as s) {
          <span class="context-group">{{ s.group }}</span>
          <app-icon name="chevron-right" class="context-sep" />
          <span class="context-page">{{ s.label }}</span>
        }
      </div>

      <div class="topbar-actions">
        <app-notification-bell />
        <button type="button" class="user-button" [matMenuTriggerFor]="userMenu" aria-label="Account menu">
          <span class="avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user-text">
            <span class="user-name">{{ displayName() }}</span>
            <span class="user-role">{{ roleLabel() }}</span>
          </span>
          <app-icon name="chevron-down" class="user-caret" />
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          @if (authService.currentUser(); as user) {
            <div class="menu-identity" role="presentation">
              <div class="font-medium">{{ displayName() }}</div>
              <div class="text-xs muted">{{ user.email }}</div>
            </div>
          }
          <button mat-menu-item (click)="logout()">
            <app-icon name="log-out" />
            <span>Sign out</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
